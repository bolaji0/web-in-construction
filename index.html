<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustapha Fathiu | Software Engineer</title>
    <style>
        :root {
            --bg-color: #060608;
            --primary-glow: #00f2fe;
            --secondary-glow: #4facfe;
            --text-main: #ffffff;
            --text-muted: #8a8a93;
            --form-bg: rgba(255, 255, 255, 0.02);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* --- INFINITE KINETIC BACKGROUND LAYERS --- */
        .bg-animations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        /* Ambient Glowing Orbs moving infinitely */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            mix-blend-mode: screen;
            animation: float-infinite 25s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--primary-glow);
            top: -10%;
            left: -10%;
            animation-duration: 20s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: var(--secondary-glow);
            bottom: -15%;
            right: -10%;
            animation-duration: 28s;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: #7000ff;
            top: 40%;
            left: 50%;
            animation-duration: 22s;
            animation-delay: -10s;
        }

        @keyframes float-infinite {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            50% {
                transform: translate(80px, 50px) scale(1.1) rotate(180deg);
            }
            100% {
                transform: translate(-40px, 120px) scale(0.9) rotate(360deg);
            }
        }

        /* --- CONTENT CONTAINMENT --- */
        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: radial-gradient(circle at center, transparent 20%, rgba(6, 6, 8, 0.8) 85%);
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 3.5rem 2.5rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .hero-card h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.3rem;
            background: linear-gradient(135deg, var(--text-main) 40%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-card .subtitle {
            font-size: 1rem;
            color: var(--secondary-glow);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            text-align: left;
        }

        .form-group {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 0.9rem 1.1rem;
            background: var(--form-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group textarea {
            resize: none;
            height: 100px;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
            background: rgba(255, 255, 255, 0.04);
        }

        .form-group label {
            position: absolute;
            left: 1.1rem;
            top: 0.9rem;
            color: var(--text-muted);
            transition: all 0.25s ease;
            pointer-events: none;
            font-size: 0.95rem;
        }

        .form-group input:focus ~ label,
        .form-group input:not(:placeholder-shown) ~ label,
        .form-group textarea:focus ~ label,
        .form-group textarea:not(:placeholder-shown) ~ label {
            top: -0.6rem;
            left: 0.8rem;
            font-size: 0.75rem;
            padding: 0 0.4rem;
            background: #0b0b0e;
            color: var(--primary-glow);
            border-radius: 4px;
        }

        .submit-btn {
            margin-top: 0.5rem;
            padding: 1rem;
            background: linear-gradient(135deg, var(--secondary-glow), var(--primary-glow));
            border: none;
            border-radius: 12px;
            color: #000000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>
    <!-- Infinite CSS Background System -->
    <div class="bg-animations">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="main-container">
        <div class="hero-card">
            <h1>Mustapha Fathiu</h1>
            <p class="subtitle">Software Engineer</p>
            
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder=" " required autocomplete="off">
                    <label for="name">Full Name</label>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder=" " required autocomplete="off">
                    <label for="email">Email Address</label>
                </div>
                <div class="form-group">
                    <input type="tel" id="phone" name="phone" placeholder=" " required autocomplete="off">
                    <label for="phone">Phone Number</label>
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" placeholder=" " required></textarea>
                    <label for="message">Your Message</label>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
